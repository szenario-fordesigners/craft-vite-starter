# Serve the Vite dev server under the site's own origin, so `ddev share`
# tunnels HMR along with everything else.
# `^~` so the generated "deny dotfiles" regex block doesn't swallow
# /vite-dev/node_modules/.vite/deps/*.
location ^~ /vite-dev/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
